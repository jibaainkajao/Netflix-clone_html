<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <nav>
      <div class="logo">NETFLIX</div>
      <a href="login.html" class="btn">Masuk</a>
    </nav>

    <div class="hero-content">
      <h1>Film, acara TV tak terbatas, dan banyak lagi</h1>
      <p>Tonton di mana saja. Batalkan kapan saja.</p>

      <form class="email-box" action="register.html">
        <input type="email" placeholder="Alamat email" required>
        <button type="submit">Mulai &gt;</button>
      </form>
    </div>
  </header>

  <section class="movies">
    <h2>Popular on Netflix</h2>

    <div class="movie-grid">
      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=500&q=80">
        <h3>Red Horizon</h3>
      </div>

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&w=500&q=80">
        <h3>Dark City</h3>
      </div>

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80">
        <h3>Cinema Night</h3>
      </div>

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=500&q=80">
        <h3>Shadow Hunter</h3>
      </div>
    </div>
  </section>

</body>
</html>
