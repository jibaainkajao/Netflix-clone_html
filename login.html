<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Netflix Clone</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="logo">NETFLIX</div>

    <div class="auth-box">
      <h1>Masuk</h1>

      <form>
        <input type="email" placeholder="Email atau nomor telepon" required>
        <input type="password" placeholder="Kata sandi" required>

        <button type="submit">Masuk</button>

        <div class="auth-options">
          <label>
            <input type="checkbox" checked>
            Ingat saya
          </label>
          <a href="#">Butuh bantuan?</a>
        </div>
      </form>

      <p class="switch">
        Baru di Netflix?
        <a href="register.html">Daftar sekarang.</a>
      </p>

      <p class="small-text">
        Halaman ini dilindungi oleh Google reCAPTCHA untuk memastikan kamu bukan bot.
      </p>
    </div>
  </div>
</body>
</html>
